<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SynthLab · NF-1</title>
  <link rel="stylesheet" href="css/synth.css">
</head>
<body data-skin="classic">
  <header class="appbar">
    <div class="appbar-title"><b>SynthLab</b><span>Sound design workbench</span></div>
    <div class="appbar-controls">
      <label class="ctl" data-help="presets">Patch
        <select id="preset"></select>
      </label>
      <button id="btn-init" class="btn" data-help="init">Init</button>
      <label class="ctl check" data-help="showvalues"><input type="checkbox" id="show-values" checked> Show values</label>
      <div class="dropdown" data-help="lock">
        <button class="btn" id="btn-lock">Lock sections ▾</button>
        <div class="dropdown-menu" id="lock-menu"></div>
      </div>
      <button class="btn btn-help" id="btn-help" data-help="help" aria-pressed="false"><span class="help-q">?</span> Help</button>
    </div>
  </header>

  <main id="fit">
    <div id="stage">
      <!-- Test instrument: oscilloscope + spectrum -->
      <section class="scope-unit">
        <div class="scope-screen-wrap" data-help="scope">
          <div class="bezel"><canvas id="scope"></canvas><div class="screen-glass"></div></div>
          <div class="screen-caption"><span>OSCILLOSCOPE</span><span id="tb-readout">2 ms/div</span><span id="trig-led" class="led-small"></span><span class="trig-label">TRIG</span></div>
        </div>
        <div class="scope-controls">
          <div class="tb-group" data-help="timebase"><div class="scope-ctl-title">TIME / DIV</div>
          <div class="tb-buttons" id="tb-buttons"></div></div>
          <button class="hold-btn" id="hold-btn" data-help="hold">HOLD</button>
          <div class="scope-brand">NF SCOPE-2<br><small>DUAL DISPLAY</small></div>
        </div>
        <div class="scope-screen-wrap" data-help="spectrum">
          <div class="bezel"><canvas id="spectrum"></canvas><div class="screen-glass"></div></div>
          <div class="screen-caption"><span>SPECTRUM</span><span>20 Hz – 20 kHz · log</span></div>
        </div>
      </section>

      <!-- The synthesizer -->
      <section class="synth">
        <div class="cheek left"></div>
        <div class="synth-body">
          <div class="panel" id="panel">
            <div class="panel-sections" id="sections"></div>
            <div class="panel-footer">
              <div class="brand"><span class="brand-mark">NoFoe</span><span class="brand-model">NF-1</span></div>
              <div class="brand-sub">MONOPHONIC ANALOG-STYLE SYNTHESIZER</div>
            </div>
          </div>
          <div class="keybed">
            <div class="perf">
              <div class="perf-sections" id="perf-sections"></div>
              <div class="perf-controls">
                <div class="oct-block" data-help="octave">
                  <div class="oct-title">Octave</div>
                  <div class="oct-buttons">
                    <button class="oct-btn" id="oct-down" title="Octave down (Z)">−</button>
                    <div class="oct-readout" id="oct-readout">C3</div>
                    <button class="oct-btn" id="oct-up" title="Octave up (X)">+</button>
                  </div>
                </div>
                <div class="oct-block" data-help="kbrange">
                  <div class="oct-title">Keyboard Range</div>
                  <div class="range-buttons" id="range-buttons"></div>
                  <div class="range-caption">octaves</div>
                </div>
                <div class="oct-hint">Play with A–K · Z/X octave</div>
              </div>
            </div>
            <div class="keys-well" data-help="keyboard"><div class="keys" id="keys"></div></div>
          </div>
        </div>
        <div class="cheek right"></div>
      </section>
    </div>
  </main>

  <aside class="help-panel" id="help-panel" aria-label="Help">
    <button class="help-close" id="help-close" aria-label="Close help">×</button>
    <div class="help-content"></div>
  </aside>

  <script type="module" src="js/main.js"></script>
</body>
</html>
