<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SynthLab · NF-1</title>
  <link rel="stylesheet" href="css/synth.css">
</head>
<body data-skin="classic">
  <header class="appbar">
    <div class="appbar-title"><b>SynthLab</b><button class="btn btn-synths" id="btn-synths" data-help="synths">Menu</button></div>
    <div class="appbar-controls">
      <div class="mode-switch" id="mode-switch" data-help="mode" role="tablist">
        <button data-mode="lessons" role="tab">Lessons</button>
        <button data-mode="free" role="tab">Free play</button>
      </div>
      <label class="ctl free-only" data-help="presets">Patch
        <select id="preset"></select>
      </label>
      <button id="btn-save" class="btn free-only" data-help="save">Save</button>
      <button id="btn-delete" class="btn free-only btn-danger" data-help="delete" hidden>Delete</button>
      <div class="more-wrap free-only">
        <button id="patch-more" class="btn" aria-label="More patch options" data-help="patchfiles">⋯</button>
        <div class="more-menu" id="patch-more-menu" hidden>
          <button id="btn-export">Export my patches…</button>
          <button id="btn-import">Import patches…</button>
        </div>
        <input type="file" id="import-file" accept=".json,application/json" hidden>
      </div>
      <button id="btn-init" class="btn free-only" data-help="init">Init</button>
      <label class="ctl check" data-help="showvalues"><input type="checkbox" id="show-values"> Show values</label>
      <label class="ctl check modular-only" data-help="fadedcables" hidden><input type="checkbox" id="faded-cables"> See-through cables</label>
      <div class="zoom-ctl" data-help="zoom">
        <button id="zoom-out" aria-label="Zoom out">−</button>
        <button id="zoom-level" class="zoom-level" title="Fit to window">100%</button>
        <button id="zoom-in" aria-label="Zoom in">+</button>
      </div>
      <button class="btn btn-scopes" id="btn-scopes" data-help="scopes" aria-pressed="false" hidden>Scopes</button>
      <button class="btn btn-help" id="btn-help" data-help="help" aria-pressed="false" title="Hover help: rest on any control for a second"><span class="help-q">?</span> Help</button>
    </div>
  </header>

  <div class="lesson-wrap" id="lesson-wrap">
  <section class="lesson-bar" id="lesson-bar" hidden>
    <div class="lb-head">
      <div class="lb-eyebrow" id="lb-eyebrow">Lesson 1</div>
      <div class="lb-title" id="lb-title">Oscillators</div>
      <select class="lb-lesson" id="lb-lesson" aria-label="Choose a lesson" data-help="lesson-pick"></select>
    </div>
    <div class="lb-task">
      <div class="lb-steps" id="lb-steps" data-help="lesson-steps"></div>
      <div class="lb-task-head"><span class="lb-task-title" id="lb-task-title"></span><span class="lb-status" id="lb-status"></span></div>
      <div class="lb-task-text" id="lb-task-text"></div>
      <div class="lb-question" id="lb-question" hidden></div>
      <div class="lb-feedback" id="lb-feedback"></div>
      <div class="lb-hintbox" id="lb-hintbox" hidden>
        <div class="lb-hint-text" id="lb-hint-text"></div>
        <div class="lb-heat" id="lb-heat"><span class="lb-heat-end">Cold</span><div class="lb-heat-track"><div class="lb-heat-fill" id="lb-heat-fill"></div></div><span class="lb-heat-word" id="lb-heat-word">Cold</span></div>
      </div>
    </div>
    <div class="lb-actions">
      <button class="lb-btn primary" id="lb-start">Start</button>
      <button class="lb-btn" id="lb-hear" data-help="lesson-hear"><span aria-hidden="true">▶</span> Hear target</button>
      <button class="lb-btn hint" id="lb-hint" data-help="lesson-hint" hidden>💡 Hint</button>
      <button class="lb-btn quiet" id="lb-reset" data-help="lesson-reset">Reset controls</button>
      <label class="lb-check" id="lb-ghost-wrap" data-help="lesson-ghost"><input type="checkbox" id="lb-ghost" checked> Show target on scopes</label>
      <button class="lb-btn primary" id="lb-next" hidden>Next sound ▸</button>
    </div>
  </section>
  </div>

  <main id="fit">
    <div id="stage">
      <!-- Test instrument: oscilloscope + spectrum -->
      <section class="scope-unit">
        <div class="scope-screen-wrap" data-help="scope">
          <div class="bezel"><canvas id="scope"></canvas><div class="screen-glass"></div></div>
          <div class="screen-caption"><span>OSCILLOSCOPE</span><span id="tb-readout">2 ms/div</span><span id="trig-led" class="led-small"></span><span class="trig-label">TRIG</span></div>
        </div>
        <div class="scope-controls">
          <div class="tb-group" data-help="timebase"><div class="scope-ctl-title">TIME / DIV</div>
          <div class="tb-buttons" id="tb-buttons"></div></div>
          <button class="hold-btn" id="hold-btn" data-help="hold">HOLD</button>
          <button class="hold-btn max-btn" id="max-btn" data-help="maximise">MAXIMISE</button>
          <div class="scope-brand">NF SCOPE-2<br><small>DUAL DISPLAY</small></div>
        </div>
        <div class="scope-screen-wrap" data-help="spectrum">
          <div class="bezel"><canvas id="spectrum"></canvas><div class="screen-glass"></div></div>
          <div class="screen-caption"><span>SPECTRUM</span><span>20 Hz – 20 kHz · log</span></div>
        </div>
      </section>

      <!-- The synthesizer -->
      <section class="synth">
        <div class="cheek left"></div>
        <div class="synth-body">
          <div class="panel" id="panel">
            <div class="panel-sections" id="sections"></div>
            <div class="panel-footer">
              <div class="brand"><span class="brand-mark">NoFoe</span><span class="brand-model">NF-1</span></div>
              <div class="brand-sub">MONOPHONIC ANALOG-STYLE SYNTHESIZER</div>
            </div>
          </div>
          <div class="wood-band" aria-hidden="true">
            <div class="nameplate"><span class="np-mark">NoFoe</span><span class="np-model"></span></div>
          </div>
          <div class="keybed">
            <div class="perf">
              <div class="perf-sections" id="perf-sections"></div>
              <div class="perf-controls">
                <div class="oct-block" data-help="octave">
                  <div class="oct-title">Octave</div>
                  <div class="oct-buttons">
                    <button class="oct-btn" id="oct-down" title="Octave down (Z)">−</button>
                    <div class="oct-readout" id="oct-readout">C3</div>
                    <button class="oct-btn" id="oct-up" title="Octave up (X)">+</button>
                  </div>
                </div>
                <div class="oct-block" data-help="kbrange">
                  <div class="oct-title">Keyboard Range</div>
                  <div class="range-buttons" id="range-buttons"></div>
                  <div class="range-caption">octaves</div>
                </div>
                <div class="oct-hint">Play with A–K · Z/X octave</div>
              </div>
            </div>
            <div class="keys-well" data-help="keyboard"><div class="keys" id="keys"></div></div>
          </div>
        </div>
        <div class="cheek right"></div>
      </section>

      <!-- Effects: a small separate unit shared by every synth, folded away below the keyboard -->
      <div class="fx-drawer" id="fx-drawer">
        <button class="fx-tab" id="fx-tab" data-help="fxtab" aria-expanded="false" aria-controls="fx-unit">FX <span class="fx-arrow">▾</span></button>
        <section class="fx-unit" id="fx-unit" data-no-fit hidden>
          <div class="fx-sections" id="fx-sections"></div>
        </section>
      </div>
    </div>
  </main>

  <div class="start-menu" id="start-menu" hidden>
    <div class="sm-inner" role="dialog" aria-labelledby="sm-title">
      <button class="sm-close" id="sm-close" aria-label="Close">×</button>
      <div class="sm-eyebrow">SynthLab</div>
      <h1 class="sm-title" id="sm-title">Choose a synth</h1>
      <div class="sm-cards" id="sm-cards"></div>
    </div>
  </div>

  <div class="lesson-modal" id="lesson-modal" hidden>
    <div class="lm-card" role="dialog" aria-labelledby="lm-title">
      <div class="lm-eyebrow" id="lm-eyebrow">Lesson complete</div>
      <h2 class="lm-title" id="lm-title"></h2>
      <p class="lm-text" id="lm-text"></p>
      <div class="lm-actions">
        <button class="lb-btn primary" id="lm-next">Next lesson</button>
        <button class="lb-btn" id="lm-replay">Replay lesson</button>
        <button class="lb-btn quiet" id="lm-free">Free play</button>
      </div>
    </div>
  </div>

  <div class="lesson-modal" id="save-dialog" hidden>
    <form class="lm-card save-card" id="save-form" role="dialog" aria-labelledby="save-title">
      <h2 class="save-title" id="save-title">Save patch</h2>
      <label class="save-label" for="save-name">Name</label>
      <input id="save-name" class="save-input" maxlength="40" placeholder="Warm detuned bass" autocomplete="off">
      <div class="save-error" id="save-error" role="alert"></div>
      <div class="save-actions">
        <button type="button" class="lb-btn quiet" id="save-cancel">Cancel</button>
        <button type="submit" class="lb-btn primary" id="save-ok">Save</button>
      </div>
    </form>
  </div>
  <div class="toast" id="toast" role="status"></div>

  <aside class="help-panel" id="help-panel" aria-label="Help">
    <div class="help-content"></div>
  </aside>

  <script type="module" src="js/main.js"></script>
</body>
</html>
